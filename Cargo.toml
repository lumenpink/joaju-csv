[package]
name = "joaju-csv"
version = "0.2.0-dev.36+20261102.8e494f7"
edition = "2021"
description = "A fast and deterministic Rust library for tabular CSV manipulation, relational projections, and filtering"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju-csv"
homepage = "https://codeberg.org/lumenpink/joaju-csv"
documentation = "https://docs.rs/joaju-csv"
readme = "README.md"
keywords = ["csv", "tabular", "filter", "projection", "dataframe"]
categories = ["command-line-utilities", "data-structures", "development-tools"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "joaju-csv"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "joaju_csv"
path = "src/lib.rs"
