[package]
name = "ssot-rs"
version = "0.1.0"
edition = "2021"
description = "Motor soberano em Rust para Fonte Única de Dados (SSOT), projeções e filtros tabulares"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/ssot-rs"
homepage = "https://codeberg.org/lumenpink/ssot-rs"
documentation = "https://docs.rs/ssot-rs"
readme = "README.md"
keywords = ["ssot", "csv", "tabular", "projection", "pedigree"]
categories = ["command-line-utilities", "data-structures", "development-tools"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ssot-rs"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "ssot_rs"
path = "src/lib.rs"
